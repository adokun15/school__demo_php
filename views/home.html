<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Kwasu: Best School ever!</title>
        <style>
             * {
        box-sizing: border-box;
            }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
    }

    main {
        width: min(420px, 92%);
        margin: 40px auto;
    }
    header {
        margin-bottom: 25px;
    }
    h1 {
        margin: 0 0 8px;
        font-size: 28px;
    }
    a {
        color: white;
        text-decoration: none;
    }
    header p {
        margin: 0;
        color: #666;
    }
    form {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 25px;
    }
    fieldset {
        border: 0;
        padding: 0;
        margin: 0;
    }
    legend {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 22px;
    }
    .field {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-bottom: 18px;
    }
    label {
        font-size: 14px;
        font-weight: 500;
    }
    input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
        outline: none;
    }
    input:focus {
        border-color: #222;
    }
    button {
        width: fit-content;
        padding: 11px;
        margin: 40px auto;
        border: 0;

        border-radius: 6px;
        background: green;
        color: white;
        font: inherit;
        cursor: pointer;
    }
    button:hover {
        background: #444;
    }
        #cards {
            margin: 45px 0;
            width: 100%;
            display: grid;
            column-gap: 1rem;
            grid-template-columns: 1fr 1fr 1fr;
        }

        #box_2 {
            padding: 20px 1%;
            margin: 0 auto;
            width: 70%;
        }

        .card_box {
            grid-column: auto;
            box-shadow: inset;
            padding: 4px 12px;
        }

        .card_box_header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .card_box_desc {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .card_box_button {
            margin-top: 16px;
            border-radius: 3px;
            background-color: green;
            padding: 4px 14px;
            outline: none;
            border: none;
            color: white;
        }

</style>
</head>

<body style="height: 100vh; display: flex;">    
    <section style="background-color:green; width:30%; ">
        <img />
    </section>
   
 <main id="box_2">
    <article>
       <div style=" margin: 1rem auto; width: fit-content;">
            <img style="margin: 40px auto; " width="150px" height="150px" src="public/KWASU_kwasu-transparent.png" />
            <p
            style="text-align: center; 
            font-weight: 700; font-family: Arial, Helvetica, 
            sans-serif; color: green; font-size: 1.25rem;">
         Kwara State University, Malete
        </p>
        <p style="">School of Greener Pasture</p>
        </div>

    </article>

    <article style="display: flex; max-width:250px; justify-content: space-between; margin: 0 auto; ">  
        <button>
               <a href="register"> Sign up</a>
            </button>
            <button>
            <a href="login">Login</a>

        </button>
    </article>

</main>
</body>
</html>
